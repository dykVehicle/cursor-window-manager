<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#0d1117"/>

  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dx="0" dy="8" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.6" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Center Group -->
  <!-- Scale 1.6 unchanged -->
  <g transform="translate(256, 256) scale(1.6)">
    
    <!-- Top-Left: Blue -->
    <!-- offset increased to 70 -->
    <g transform="translate(-70, -70) rotate(-45)" filter="url(#shadow)">
      <path d="M0,-70 L-42,56 L0,28 Z" fill="#60a5fa"/>
      <path d="M0,-70 L42,56 L0,28 Z" fill="#1d4ed8"/>
    </g>

    <!-- Top-Right: Purple -->
    <g transform="translate(70, -70) rotate(45)" filter="url(#shadow)">
      <path d="M0,-70 L-42,56 L0,28 Z" fill="#c084fc"/>
      <path d="M0,-70 L42,56 L0,28 Z" fill="#7e22ce"/>
    </g>

    <!-- Bottom-Left: Orange -->
    <g transform="translate(-70, 70) rotate(-135)" filter="url(#shadow)">
      <path d="M0,-70 L-42,56 L0,28 Z" fill="#fb923c"/>
      <path d="M0,-70 L42,56 L0,28 Z" fill="#c2410c"/>
    </g>

    <!-- Bottom-Right: Green -->
    <g transform="translate(70, 70) rotate(135)" filter="url(#shadow)">
      <path d="M0,-70 L-42,56 L0,28 Z" fill="#4ade80"/>
      <path d="M0,-70 L42,56 L0,28 Z" fill="#15803d"/>
    </g>
  </g>
</svg>
